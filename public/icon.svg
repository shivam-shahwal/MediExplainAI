<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Inner Card Frame -->
  <rect x="80" y="80" width="352" height="352" rx="48" fill="#ffffff" fill-opacity="0.08" filter="url(#softShadow)" />
  
  <!-- Medical Document / Report Body -->
  <rect x="136" y="112" width="240" height="288" rx="28" fill="#ffffff" />
  
  <!-- Document Header Lines -->
  <rect x="168" y="152" width="100" height="14" rx="7" fill="#0f766e" />
  <rect x="168" y="176" width="176" height="10" rx="5" fill="#cbd5e1" />
  
  <!-- Divider -->
  <line x1="168" y1="202" x2="344" y2="202" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  
  <!-- Educational Sparkle / Cross Center Icon -->
  <g transform="translate(196, 226)">
    <!-- Medical Cross -->
    <rect x="46" y="16" width="28" height="88" rx="12" fill="url(#crossGrad)" />
    <rect x="16" y="46" width="88" height="28" rx="12" fill="url(#crossGrad)" />
    
    <!-- Pulse Sparkle Core -->
    <circle cx="60" cy="60" r="14" fill="#ffffff" />
    <circle cx="60" cy="60" r="7" fill="#0f766e" />
  </g>
  
  <!-- Report Line Placeholders -->
  <rect x="168" y="348" width="130" height="10" rx="5" fill="#94a3b8" />
  <rect x="312" y="348" width="32" height="10" rx="5" fill="#0f766e" />
  <rect x="168" y="368" width="100" height="10" rx="5" fill="#cbd5e1" />
  <rect x="312" y="368" width="32" height="10" rx="5" fill="#0f766e" />
</svg>
